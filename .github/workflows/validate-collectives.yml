name: Validate collective syntax
on:
  push:
    branches: [feat/collective-syntax-lowering]
    paths: [.github/workflows/validate-collectives.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra cuda
      - name: Apply and verify signed-zero semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '        args = \[cast(value, arg_dtype) for value in args\]' python/ntilang/testing.py)" = 1
          cat > /tmp/zero-ties.txt <<'FIX'
                  if e.op in ("maximum", "minimum", "max", "min") and arg_dtype.startswith("float"):
                      # PTX min/max order +0 above -0. Host NumPy scalar and SIMD
                      # implementations can choose different operands for equal zeros.
                      if args[0] == 0 and args[1] == 0:
                          a_negative, b_negative = (bool(np.signbit(value)) for value in args)
                          negative = (
                              a_negative and b_negative
                              if e.op in ("maximum", "max")
                              else a_negative or b_negative
                          )
                          return cast(np.copysign(0.0, -1.0 if negative else 1.0), dtype)
          FIX
          sed -i '/        args = \[cast(value, arg_dtype) for value in args\]/r /tmp/zero-ties.txt' python/ntilang/testing.py
          test "$(grep -c '    operation = np.add if kind == "cumsum" else np.fmax' tests/test_scans.py)" = 1
          cat > /tmp/oracle.txt <<'FIX'
              def operation(x, y):
                  if kind == "cumsum":
                      return np.add(x, y)
                  result = np.fmax(x, y)
                  if a.dtype.kind == "f":
                      # The device max instruction ranks +0 above -0 independently
                      # of host SIMD tie-breaking. Both negative inputs preserve -0.
                      both_zero = (x == 0) & (y == 0)
                      zero = np.where(np.signbit(x) & np.signbit(y), -0.0, 0.0)
                      result = np.where(both_zero, zero, result).astype(a.dtype)
                  return result
          FIX
          sed -i '/    operation = np.add if kind == "cumsum" else np.fmax/{
          r /tmp/oracle.txt
          d
          }' tests/test_scans.py
          cat >> docs/semantics.md <<'DOC'
          
          Scalar `max`/`maximum` and `min`/`minimum` explicitly order positive zero
          above negative zero in the CPU reference, matching the PTX min/max contract.
          The scan reference oracle uses the same documented ordering independently
          of NumPy SIMD operand tie-breaking. Tests retain signed-zero assertions and
          separately exercise NaN-propagating and non-NaN-preferring variants. Device
          execution tests are provided; hardware validation remains outstanding.
          DOC
          uv run --frozen --extra cuda ruff check --fix python examples tests
          uv run --frozen --extra cuda ruff format python examples tests
          uv run --frozen --extra cuda pytest -q tests/test_scans.py tests/test_minmax_zero.py -m 'not gpu'
          git add python/ntilang/testing.py tests/test_scans.py tests/test_minmax_zero.py docs/semantics.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve PTX signed-zero ordering in extrema references'
          git push origin HEAD:refs/heads/feat/collective-syntax-lowering
      - name: Verify compiler dependencies
        run: uv run --frozen --extra cuda python -c "import cutlass; from importlib.metadata import version; from tvm_ffi.utils import kwargs_wrapper; assert version('nvidia-cutlass-dsl') == '4.7.1'; assert version('apache-tvm-ffi') == '0.1.11'"
      - name: Full semantic and native compilation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          uv run --frozen --extra cuda pytest -q -m 'not gpu' --junitxml=test-results/collectives.xml 2>&1 | tee test-results/pytest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collectives-test-results
          path: test-results/
          retention-days: 7
