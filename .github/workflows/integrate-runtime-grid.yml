name: Integrate runtime iteration
on:
  push:
    branches: [feat/runtime-grid-coordinates]
    paths: [.github/workflows/integrate-runtime-grid.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'nya-a-cat/Ntilang' && github.ref == 'refs/heads/feat/runtime-grid-coordinates'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra cuda
      - name: Apply the reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat > /tmp/runtime.patch <<'PATCH'
          diff --git a/python/ntilang/frontend.py b/python/ntilang/frontend.py
          --- a/python/ntilang/frontend.py
          +++ b/python/ntilang/frontend.py
          @@ -10,7 +10,7 @@
           from contextlib import contextmanager
           from math import prod
           
          -from . import language, macros, metadata, scan, tile_ops
          +from . import iteration, language, macros, metadata, scan, tile_ops
           from .ir import (
               DTYPES,
               Buffer,
          @@ -315,6 +315,8 @@
           
               def construction_call(self, node):
                   target = self.macro_value(node.func)
          +        if target is language.index_to_coordinates:
          +            return iteration.coordinates(self, node)
