name: Apply syntax implementation
on:
  push:
    branches: [feat/tilelang-syntax-coverage]
    paths: [.github/workflows/apply-syntax-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'nya-a-cat/Ntilang' && github.ref == 'refs/heads/feat/tilelang-syntax-coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra cuda
      - name: Apply frontend integration and commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat > /tmp/integration.patch <<'PATCH'
          diff --git a/README.md b/README.md
          --- a/README.md
          +++ b/README.md
          @@ -116,6 +116,7 @@
           | [Tiled matrix multiplication](examples/matmul.py) | Shared-memory tiles and warp-level Tensor Core GEMM |
           | [Matrix multiplication + ReLU](examples/matmul_relu.py) | Scale, bias, and activation in the accumulator layout |
           | [Softmax](examples/softmax.py) | Maximum and sum reductions with fragment broadcasts |
          +| [Cumulative sum](examples/cumsum.py) | Inclusive row scans, reverse traversal, and tail tiles |
           | [Tiled transpose](examples/transpose.py) | Sliced copies and shared-memory communication |
           | [Fragment affine transform](examples/fragment_affine.py) | Elementwise operations on register fragments |
           | [Piecewise transform](examples/piecewise.py) | Data-dependent branches and guarded stores |
          diff --git a/docs/compatibility.md b/docs/compatibility.md
          --- a/docs/compatibility.md
          +++ b/docs/compatibility.md
          @@ -29,6 +29,18 @@
           
           ## Current work
           
          +Inclusive `cumsum`/`cummax` support one-/two-dimensional shared and fragment
          +regions, negative axes, reverse scans, in-place updates, and fragment-output
          +conversion. Their shared lowering preserves the pinned CUDA 32-element segment
          +tree, source-dtype rounding, and sequential carries. Workspaces are reused and
          +included in the block memory budget. `transpose` supports shared regions,
          +batch/singleton axes, dtype conversion, and overlapping temporary snapshots.
          +Static `grid` nests and scalar `clamp` are implemented. See
          +[semantics.md](semantics.md#inclusive-scans-and-shared-transpose) for signatures,
          +scope restrictions, annotations, and numerical verification limits. Wider scan
          +ranks, Boolean scans, dynamic grid extents, additional layouts, hardware numerical
          +parity, and device performance remain open.
          +
           CUDA diagnostic calls support `T.print` for scalar IR values, messages and the
           existing global/shared/fragment buffer types, plus `T.device_assert` with optional
           source/macro stack information. Print thread selection and fragment materialization
          diff --git a/python/ntilang/frontend.py b/python/ntilang/frontend.py
          --- a/python/ntilang/frontend.py
          +++ b/python/ntilang/frontend.py
          @@ -10,7 +10,7 @@
           from contextlib import contextmanager
           from math import prod
           
          -from . import language, macros, metadata
          +from . import language, macros, metadata, tile_ops
           from .ir import (
               DTYPES,
               Buffer,
          @@ -110,6 +110,8 @@
                   self.variables: set[str] = set()
                   self.initialized: set[str] = set()
                   self.allocated: list[Buffer] = []
          +        self.prologue: list[Statement] = []
          +        self.scan_workspaces = {}
                   self.threads = 0
                   self.parallel_context = None
                   self.mutable = {}
          @@ -1072,6 +1074,10 @@
                       if value is not NO_CONSTRUCTION_CALL:
                           return self.scalar_value(value, node)
                       name = self.call_name(node)
          +            if name == "clamp":
          +                args = self.bind_call(node, ["dst", "min_val", "max_val"], {})
          +                value, lower, upper = (self.expr(args[key]) for key in ("dst", "min_val", "max_val"))
          +                return Expr("min", (Expr("max", (value, lower)), upper))
                       if name == "likely":
                           if len(node.args) > 2:
                               self.fail(node, "T.likely takes at most two positional arguments")
          @@ -1711,6 +1717,29 @@
                       if self.before_launch:
                           self.fail(node, "Loops before T.Kernel require further construction-time lowering")
                       name = self.call_name(node.iter)
          +            if name == "grid":
          +                self.keywords(node.iter, set())
          +                if node.orelse:
          +                    self.fail(node, "Loop else clauses are not supported")
          +                targets = node.target.elts if isinstance(node.target, (ast.Tuple, ast.List)) else [node.target]
          +                extents = tuple(self.static(arg) for arg in node.iter.args)
          +                if not extents or len(targets) != len(extents) or any(not isinstance(t, ast.Name) for t in targets):
          +                    self.fail(node, "T.grid requires one named variable per extent")
          +                if len({t.id for t in targets}) != len(targets):
          +                    self.fail(node, "T.grid variables must have unique names")
          +                if any(type(size) is not int or size < 0 for size in extents):
          +                    self.fail(node, "T.grid extents must be nonnegative static integers")
          +                # Capture every extent before rebinding any grid induction variable.
          +                serial_name = self.fresh("grid_serial")
          +                self.constants[serial_name] = language.serial
          +                body = node.body
          +                for target, extent in reversed(tuple(zip(targets, extents))):
          +                    call = ast.Call(func=ast.Name(id=serial_name, ctx=ast.Load()), args=[ast.Constant(extent)], keywords=[])
          +                    loop = ast.For(target=target, iter=call, body=body, orelse=[])
          +                    ast.copy_location(loop, node)
          +                    ast.fix_missing_locations(loop)
          +                    body = [loop]
          +                return self.statement(body[0], parallel=parallel, nested=nested)
                       if name not in ("Parallel", "serial", "Serial", "Pipelined", "unroll", "Unroll"):
                           self.fail(node, f"Unsupported loop {name}")
                       if parallel and name == "Parallel":
          @@ -1814,6 +1843,10 @@
                           return self.copy_statement(call, node, parallel, nested)
                       if parallel:
                           self.fail(node, "Collective tile operations cannot appear inside T.Parallel")
          +            if name == "transpose":
          +                return tile_ops.transpose(self, call, node)
          +            if name in ("cumsum", "cummax"):
          +                return tile_ops.scan(self, call, node, name)
                       if name == "reduce" or name.startswith("reduce_"):
                           return self.reduction(call, name, loc)
                       if name in ("clear", "fill"):
          @@ -1961,7 +1994,7 @@
                       grid,
                       block_vars,
                       self.threads,
          -            statements,
          +            (*self.prologue, *statements),
                       self.source,
                   )
           
          diff --git a/python/ntilang/language.py b/python/ntilang/language.py
          --- a/python/ntilang/language.py
          +++ b/python/ntilang/language.py
          @@ -182,6 +182,7 @@
           for _name in (
               "Kernel",
               "Parallel",
          +    "grid",
               "serial",
               "Serial",
               "Pipelined",
          @@ -197,6 +198,10 @@
               "device_assert",
               "likely",
               "copy",
          +    "transpose",
          +    "cumsum",
          +    "cummax",
          +    "clamp",
               "clear",
               "fill",
               "gemm",
          PATCH
          git apply --check /tmp/integration.patch
          git apply /tmp/integration.patch
          cat >> docs/semantics.md <<'DOC'
          
          ## Inclusive scans and shared transpose
          
          `T.cumsum(src, dst=None, dim=0, reverse=False, annotations=None)` and
          `T.cummax` accept one- or two-dimensional shared/fragment buffers and explicit
          unit-stride regions. Negative axes are normalized; omitted destinations update
          the source in place. Shapes must match. Shared sources require shared destinations
          of the same dtype. Fragment sources stage through shared storage and permit final
          copy dtype conversion. Boolean scans and nonempty annotations remain unsupported.
          The launch uses 32, 64, 128, 256, 512, or 1024 threads.
          
          The lowering preserves the pinned CUDA `InclusiveScanLine` arithmetic schedule:
          32-element segments, shuffle distances 1/2/4/8/16, identity-padded tail lanes,
          source-dtype rounding after each combine, and sequential segment carries. Reverse
          scans traverse segments backwards and combine with higher-index neighbors.
          `cummax` uses non-NaN-preferring maximum, including the identity carry. The CPU
          reference executes this schedule; NVIDIA device numerical parity and performance
          remain unverified. Two shared ping-pong tiles, padded to 32 along the scan axis,
          and a per-line carry tile implement communication with block barriers. Workspace
          is reused by compatible calls and counted in the 48 KiB block memory limit.
          
          `T.transpose(src, dst, annotations=None)` swaps the final two axes of shared
          buffers or explicit regions, preserving batch axes and singleton dimensions.
          The destination shape must match the permutation. Copies apply destination dtype
          conversion and guard tensor bounds. Aliased/overlapping temporary regions capture
          the source before writes. Nonempty annotations and other memory scopes remain
          unsupported. These collectives may appear in uniform branches or serial loops;
          placing them inside a `T.Parallel` body is rejected.
          
          `T.grid(*extents)` constructs nested serial loops in argument order. This version
          accepts nonnegative static integer extents, captures all extents before binding
          induction variables, and requires a distinct variable per dimension. Zero extents
          produce empty domains. Existing serial-loop scope, initialization, and early-exit
          rules apply. Dynamic grid extents remain unsupported.
          
          `T.clamp(dst, min_val, max_val)` composes `T.min(T.max(dst, min_val), max_val)`.
          Operands are evaluated once in argument order and follow existing promotion and
          non-NaN preference rules; reversed bounds retain the same composition.
          DOC
          uv run --frozen --extra cuda ruff check --fix python examples tests
          uv run --frozen --extra cuda ruff format python examples tests
          git add README.md docs/compatibility.md docs/semantics.md examples/cumsum.py python/ntilang/frontend.py python/ntilang/language.py python/ntilang/tile_ops.py tests/test_scans.py tests/test_transpose_op.py tests/test_grid_clamp.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate and format inclusive scans, shared transpose, grid, and clamp'
          git push origin HEAD:refs/heads/feat/tilelang-syntax-coverage
      - name: Validate full pinned compiler suite
        run: uv run --frozen --extra cuda pytest -q -m 'not gpu' --junitxml=test-results/syntax.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: syntax-test-results
          path: test-results/
          retention-days: 7
