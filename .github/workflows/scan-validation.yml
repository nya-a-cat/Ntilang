name: Validate inclusive scans

on:
  push:
    branches: [feat/tilelang-syntax-coverage]
    paths: [.github/workflows/scan-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.6"
          python-version: "3.12"
          enable-cache: true
      - name: Apply checked source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a034a4d489c6c5d6e02a8c9d8b76e15615a4dd2a
          git show a034a4d489c6c5d6e02a8c9d8b76e15615a4dd2a:.github/workflows/scan-validation.yml | sed -n '/^          \/Td6WFo/,/^          PATCH/p' | sed '$d;s/^          //' | base64 -d | xz -d > /tmp/scans.patch
          echo '862b68fa9a2743eb1acb8d2b30799c78222099e404e14afcd66fddcfa9c21868  /tmp/scans.patch' | sha256sum --check
          git apply --check /tmp/scans.patch
          git apply /tmp/scans.patch
      - run: uv sync --frozen --extra cuda
      - name: Format and lint
        run: |
          uv run --frozen ruff check --fix python examples tests
          uv run --frozen ruff format python examples tests
          uv run --frozen ruff check python examples tests
          git diff --check
      - name: Store formatted source tree for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          : > /tmp/entries.jsonl
          for path in docs/compatibility.md docs/semantics.md python/ntilang/codegen.py python/ntilang/frontend.py python/ntilang/language.py python/ntilang/scan.py python/ntilang/testing.py python/ntilang/validation.py tests/test_scans.py; do
            jq -n --arg path "$path" --rawfile content "$path" '{path:$path,mode:"100644",type:"blob",content:$content}' >> /tmp/entries.jsonl
          done
          jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree:$base,tree:(. + [{path:".github/workflows/scan-validation.yml",mode:"100644",type:"blob",sha:null}])}' /tmp/entries.jsonl > /tmp/tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq .sha | tee test-results/tree-sha.txt
          git rev-parse HEAD | tee test-results/parent-sha.txt
      - name: Require pinned compiler
        run: uv run --frozen --extra cuda python -c "import cutlass; from importlib.metadata import version; from tvm_ffi.utils import kwargs_wrapper; assert version('nvidia-cutlass-dsl') == '4.7.1'; assert version('apache-tvm-ffi') == '0.1.11'"
      - name: Semantic and native compilation tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --extra cuda pytest -q -m 'not gpu' --junitxml=test-results/scans-full.xml 2>&1 | tee test-results/pytest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inclusive-scan-validation
          path: test-results/
          retention-days: 7
